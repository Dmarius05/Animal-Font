  html, body { margin: 0; background: #fff; color: #000; }
  body { min-height: 100vh; }
  #stage {
    font-family: "NewFontVF", sans-serif;
    font-variation-settings: "wght" 0;
    font-size: 120px;
    line-height: 1.05;
    padding: 24px 32px 96px;
    display: flex;
    flex-wrap: wrap;          
    gap: 0 0.12em;
    word-break: keep-all;
    user-select: none;
  }
  #stage span { display: inline-block; }
  #ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 32px; background: #fff;
    display: flex; align-items: center; gap: 12px;
    font: 11px/1 system-ui, sans-serif; color: #000;
  }
  #ui input { width: 160px; accent-color: #000; }
  #loader { display: none; margin-left: auto; }
  #loader.show { display: block; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="ui">
  <span>Size</span>
  <input id="size" type="range" min="16" max="400" value="120">
  <span id="sizeVal">120px</span>
  <label id="loader">Font not found – pick NewFontVF.woff
    <input id="file" type="file" accept=".woff,.woff2,.ttf,.otf">
  </label>
</div>

<script>
  const stage = document.getElementById("stage");
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(ch => {
    const s = document.createElement("span");
    s.textContent = ch;
    stage.appendChild(s);
  });

  // Size slider
  const size = document.getElementById("size");
  const sizeVal = document.getElementById("sizeVal");
  size.addEventListener("input", () => {
    stage.style.fontSize = size.value + "px";
    sizeVal.textContent = size.value + "px";
  });

  
  const DURATION = 4000; 
  function tick(t) {
    const p = (t % (DURATION * 2)) / DURATION;      
    const w = (p <= 1 ? p : 2 - p) * 100;           
    stage.style.fontVariationSettings = `"wght" ${w.toFixed(2)}`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

 
  document.fonts.load('20px "NewFontVF"').then(f => {
    if (!f.length) document.getElementById("loader").classList.add("show");
  }).catch(() => document.getElementById("loader").classList.add("show"));

  document.getElementById("file").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    const face = new FontFace("NewFontVF", await file.arrayBuffer());
    await face.load();
    document.fonts.add(face);
    document.getElementById("loader").classList.remove("show");
  });
</script>
</body>
</html>
